services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-tracker-api
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: finance-tracker-db
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: finance_tracker
    ports:
      - "5433:5432"
